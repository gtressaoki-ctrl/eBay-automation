name: Japan Export Setup

# One-time: create the Japan ship-from location and the "Japan export"
# shipping policy. Safe to re-run; existing ones are left alone.
on:
  workflow_dispatch:
    inputs:
      city:
        description: "City in English, e.g. Yokohama (shown to buyers as 'Located in')"
        required: false
      prefecture:
        description: "Prefecture in English, e.g. Kanagawa"
        required: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Create location and shipping policy
        env:
          PYTHONPATH: src
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_MARKETPLACE_ID: ${{ vars.EBAY_MARKETPLACE_ID }}
          EBAY_ENV: ${{ vars.EBAY_ENV }}
          EBAY_PAYMENT_POLICY_ID: ${{ vars.EBAY_PAYMENT_POLICY_ID }}
          EBAY_RETURN_POLICY_ID: ${{ vars.EBAY_RETURN_POLICY_ID }}
          EXPORT_MERCHANT_LOCATION_KEY: ${{ vars.EXPORT_MERCHANT_LOCATION_KEY }}
          EXPORT_FULFILLMENT_POLICY_NAME: ${{ vars.EXPORT_FULFILLMENT_POLICY_NAME }}
          EXPORT_HANDLING_DAYS: ${{ vars.EXPORT_HANDLING_DAYS }}
          EXPORT_LOCATION_CITY: ${{ inputs.city || vars.EXPORT_LOCATION_CITY }}
          EXPORT_LOCATION_PREFECTURE: ${{ inputs.prefecture || vars.EXPORT_LOCATION_PREFECTURE }}
        run: python scripts/export_setup.py
