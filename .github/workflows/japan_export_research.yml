name: Japan Export Research

# Read-only toward eBay and Yahoo: measures demand and domestic prices,
# writes reports/export_research.md, and lists or buys nothing.
on:
  schedule:
    - cron: "0 21 * * 0"  # Mondays 06:00 JST
  workflow_dispatch: {}

concurrency:
  group: ebay-automation-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Measure export genres
        env:
          PYTHONPATH: src
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_ENV: ${{ vars.EBAY_ENV }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          EXPORT_FEE_RATE: ${{ vars.EXPORT_FEE_RATE }}
          EXPORT_FEE_FIXED_USD_CENTS: ${{ vars.EXPORT_FEE_FIXED_USD_CENTS }}
          EXPORT_FX_HAIRCUT: ${{ vars.EXPORT_FX_HAIRCUT }}
          EXPORT_DOMESTIC_SHIPPING_JPY: ${{ vars.EXPORT_DOMESTIC_SHIPPING_JPY }}
          EXPORT_SHIPPING_SMALL_JPY: ${{ vars.EXPORT_SHIPPING_SMALL_JPY }}
          EXPORT_SHIPPING_MEDIUM_JPY: ${{ vars.EXPORT_SHIPPING_MEDIUM_JPY }}
          EXPORT_SHIPPING_LARGE_JPY: ${{ vars.EXPORT_SHIPPING_LARGE_JPY }}
          EXPORT_TAX_REFUND: ${{ vars.EXPORT_TAX_REFUND }}
          EXPORT_MIN_PROFIT_JPY: ${{ vars.EXPORT_MIN_PROFIT_JPY }}
          EXPORT_SELLER_DUTY_RATE: ${{ vars.EXPORT_SELLER_DUTY_RATE }}
          EXPORT_DUTY_FEE_JPY: ${{ vars.EXPORT_DUTY_FEE_JPY }}
          EXPORT_SAMPLE_SIZE: ${{ vars.EXPORT_SAMPLE_SIZE }}
        run: python -m ebay_automation.export_research

      - name: Commit report
        run: |
          git config user.name "ebay-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/export_research.json reports/export_research.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): export research $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt), rebasing onto latest main and retrying..."
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
          else
            echo "No changes to commit."
          fi
