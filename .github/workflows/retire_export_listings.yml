name: Retire export listings

# Runs once when an agreed request to end export listings lands on main
# (state/export_retire_request.json), or manually.
on:
  push:
    branches: [main]
    paths: [state/export_retire_request.json]
  workflow_dispatch: {}

concurrency:
  group: ebay-automation-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Withdraw export offers
        env:
          PYTHONPATH: src
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_MARKETPLACE_ID: ${{ vars.EBAY_MARKETPLACE_ID }}
          EBAY_ENV: ${{ vars.EBAY_ENV }}
        run: |
          SKUS=$(python -c "import json;print(' '.join(json.load(open('state/export_retire_request.json'))['skus']))")
          python scripts/retire_export_listings.py $SKUS
      - name: Commit updated state
        run: |
          git config user.name "ebay-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): end export listings [skip ci]"
            for attempt in 1 2 3 4 5; do
              git push && break
              git fetch origin main && git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
          fi
