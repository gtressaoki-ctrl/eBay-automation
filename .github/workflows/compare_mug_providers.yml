name: Compare mug providers

# Read-only as far as the shop is concerned: probe products are deleted as
# soon as their cost is read, and nothing is listed or ordered.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Compare landed cost across providers
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ vars.PRINTIFY_SHOP_ID }}
        run: python scripts/compare_mug_providers.py
