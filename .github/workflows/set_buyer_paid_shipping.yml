name: Set buyer-paid shipping

on:
  workflow_dispatch:
    inputs:
      cost:
        description: "Flat domestic shipping charged to the buyer (USD)"
        default: "5.79"

permissions:
  contents: read

jobs:
  update-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Update the eBay fulfillment policy
        env:
          PYTHONPATH: src
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_MARKETPLACE_ID: ${{ vars.EBAY_MARKETPLACE_ID }}
          EBAY_ENV: ${{ vars.EBAY_ENV }}
          EBAY_FULFILLMENT_POLICY_ID: ${{ vars.EBAY_FULFILLMENT_POLICY_ID }}
          SHIPPING_CHARGE: ${{ inputs.cost }}
        run: python scripts/set_buyer_paid_shipping.py "$SHIPPING_CHARGE"
