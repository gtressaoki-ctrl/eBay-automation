name: eBay POD Research & Draft Listing

on:
  schedule:
    - cron: "0 22 * * *"  # 07:00 JST daily
  workflow_dispatch: {}

concurrency:
  group: ebay-automation-state
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  research-and-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run research + draft-listing pipeline
        env:
          PYTHONPATH: src
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_MARKETPLACE_ID: ${{ vars.EBAY_MARKETPLACE_ID }}
          EBAY_MERCHANT_LOCATION_KEY: ${{ vars.EBAY_MERCHANT_LOCATION_KEY }}
          EBAY_FULFILLMENT_POLICY_ID: ${{ vars.EBAY_FULFILLMENT_POLICY_ID }}
          EBAY_PAYMENT_POLICY_ID: ${{ vars.EBAY_PAYMENT_POLICY_ID }}
          EBAY_RETURN_POLICY_ID: ${{ vars.EBAY_RETURN_POLICY_ID }}
          EBAY_CATEGORY_ID: ${{ vars.EBAY_CATEGORY_ID }}
          EBAY_ENV: ${{ vars.EBAY_ENV }}
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ vars.PRINTIFY_SHOP_ID }}
          PRINTIFY_BLUEPRINT_ID: ${{ vars.PRINTIFY_BLUEPRINT_ID }}
          PRINTIFY_PRINT_PROVIDER_ID: ${{ vars.PRINTIFY_PRINT_PROVIDER_ID }}
          PRINTIFY_VARIANT_IDS: ${{ vars.PRINTIFY_VARIANT_IDS }}
          DAILY_LISTING_QUOTA: ${{ vars.DAILY_LISTING_QUOTA }}
          DEFAULT_MARKUP_MULTIPLIER: ${{ vars.DEFAULT_MARKUP_MULTIPLIER }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m ebay_automation.pipeline_research

      - name: Commit updated state
        run: |
          git config user.name "ebay-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): research run $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt), rebasing onto latest main and retrying..."
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
          else
            echo "No state changes to commit."
          fi
