name: Pinterest pins

on:
  schedule:
    - cron: "30 1 * * *"  # after the daily research run publishes new listings
  workflow_dispatch: {}

concurrency:
  group: ebay-automation-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pin newly published listings
        env:
          PYTHONPATH: src
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_TOKEN_KEY: ${{ secrets.PINTEREST_TOKEN_KEY }}
          PINTEREST_API_BASE: ${{ vars.PINTEREST_API_BASE }}
          PINTEREST_BOARD_NAME: ${{ vars.PINTEREST_BOARD_NAME }}
          PINTEREST_PINS_PER_RUN: ${{ vars.PINTEREST_PINS_PER_RUN }}
        run: python -m ebay_automation.pipeline_pinterest
      # Always commit: a token refresh rotates the refresh token, and losing
      # the new one would lock the next run out.
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "ebay-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): pinterest run $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            for attempt in 1 2 3 4 5; do
              git push && break
              git fetch origin main && git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
          fi
