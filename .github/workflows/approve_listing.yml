name: eBay POD Approve/Reject Listing

on:
  issue_comment:
    types: [created]

concurrency:
  # Scoped per issue, not shared with the other workflows. GitHub Actions
  # only keeps one run queued per concurrency group — a third comment
  # arriving while one is already queued silently cancels the queued one,
  # which is how three /reject comments sent back-to-back left two issues
  # never processed. Different issues touch different keys in
  # pending_listings.json, so they can run in parallel; the git push retry
  # below (fetch+rebase) still handles the case where two land at once.
  group: ebay-automation-approve-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  approve-or-reject:
    if: >
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'pending-approval') &&
      (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/reject'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Handle approval decision
        env:
          PYTHONPATH: src
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_MARKETPLACE_ID: ${{ vars.EBAY_MARKETPLACE_ID }}
          EBAY_ENV: ${{ vars.EBAY_ENV }}
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ vars.PRINTIFY_SHOP_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python -m ebay_automation.pipeline_approve

      - name: Commit updated state
        run: |
          git config user.name "ebay-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): approval decision on #${{ github.event.issue.number }} [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt), rebasing onto latest main and retrying..."
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
          else
            echo "No state changes to commit."
          fi
